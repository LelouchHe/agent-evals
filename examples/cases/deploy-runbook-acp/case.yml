# The same evaluation as ../deploy-runbook, run through the generic ACP runner.
# Prepare the Pi deps and login directories first; see docs/configuration.md.
input: Our deploy failed. Read deploy.log and write the cause and the commands to fix it into diagnosis.md.
timeoutMs: 120000
runner:
  $type: acp
  agent: ../../agents/pi.yml
  config:
    model: opencode-go/deepseek-v4.1-flash
checks:
  - $type: file
    path: diagnosis.md
    matches: "make rotate-signing-cert"
  - $type: file
    path: deploy.log
    unchanged: true
  - $type: judge
    model: opencode-go/deepseek-v4.1-flash
    apiKey: $env:OPENCODE_API_KEY
    file: diagnosis.md
    rubric:
      - The diagnosis identifies an expired artifact signing certificate as the cause.

# The ACP runner has no skill parameter: project-level skills belong to the
# fixture, at the path the harness discovers (.agents/skills/ for Pi). So the
# cases differ only in fixture, and fixture-with-skill is fixture plus the skill.
cases:
  with-skill:
    fixture: fixture-with-skill
  without-skill:
    fixture: fixture
