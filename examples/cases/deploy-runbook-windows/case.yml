# Native Windows + PowerShell worked example using the Pi runner.
# Shares the deploy.log fixture and skill from ../deploy-runbook, and validates
# the diagnosis with a PowerShell check script inside the offline Windows sandbox.
input: Our deploy failed. Read deploy.log and write the cause and the commands to fix it into diagnosis.md.
fixture: ../deploy-runbook/fixture
timeoutMs: 120000
checks:
  - $type: file
    path: diagnosis.md
    matches: "make rotate-signing-cert"
  - $type: file
    path: deploy.log
    changed: false
  - $type: shell
    files:
      checks/check-diagnosis.ps1: checks/check-diagnosis.ps1
    run:
      - powershell.exe
      - -NoLogo
      - -NoProfile
      - -NonInteractive
      - -InputFormat
      - None
      - -File
      - checks/check-diagnosis.ps1
  - $type: judge
    files:
      - diagnosis.md
    rubric:
      - The diagnosis identifies an expired artifact signing certificate as the cause.

cases:
  with-skill:
    runner:
      $type: pi
      model: opencode-go/deepseek-v4.1-flash
      apiKey: ${env:OPENCODE_API_KEY}
      skills:
        - ../deploy-runbook/skill

  baseline:
    runner:
      $type: noop
