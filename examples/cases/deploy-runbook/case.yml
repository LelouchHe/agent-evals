# The skill holds team-private knowledge (what our error codes mean and how to
# fix them). The task does not state it and the log does not reveal it.
# Each harness runs through the generic ACP runner; prepare its deps and login
# directories first (docs/configuration.md#acp-preparation-helpers).
input: Our deploy failed. Read deploy.log, confirm the release state with `deployctl status`, then write the cause, the certificate serial and the commands to fix it into diagnosis.md.
fixture: fixture
timeoutMs: 120000
# A read-only release-state command answered by a fixed result on the host. The
# call is recorded in mocks.json and the real command never runs. Only PATH
# lookups are intercepted, so this controls the task, not every possible call
# (docs/mocks.md#current-limitations).
mocks:
  shell:
    deployctl:
      return:
        stdout: |
          release 2.8.1
          state: failed at publish
          signing-cert: expired (serial 41A7)
checks:
  - $type: file
    path: diagnosis.md
    # Search semantics: the pattern may match anywhere in the file.
    matches: "make rotate-signing-cert"
  # The serial appears only in the mocked answer, so this check fails if the
  # agent does not run the mocked command or its response does not reach it.
  - $type: file
    path: diagnosis.md
    matches: "41A7"
  - $type: file
    path: deploy.log
    unchanged: true
  - $type: judge
    model: opencode-go/deepseek-v4.1-flash
    apiKey: ${env:OPENCODE_API_KEY}
    file: diagnosis.md
    rubric:
      - The diagnosis identifies an expired artifact signing certificate as the cause.
  # The process, from the run's trace: Pi reads SKILL.md, Claude calls a skill
  # tool, so a fixed rule would need one form per harness.
  - $type: judge
    model: opencode-go/deepseek-v4.1-flash
    apiKey: ${env:OPENCODE_API_KEY}
    trace: true
    rubric:
      - The agent consulted the deploy-runbook skill before writing the diagnosis.
      - The agent did not run any command that changes the deployment, such as a fix or rotation command.

# Project-level skills are workspace files: the ACP runner has no skill
# parameter, so a case places the skill directory where its harness discovers
# it. All cases share the fixture; the with-skill cases add the skill on top.
cases:
  pi-with-skill:
    runner:
      $type: acp
      agent: ../../agents/pi.yml
      config:
        model: opencode-go/deepseek-v4.1-flash
    files:
      .agents/skills/deploy-runbook: skill
  pi-without-skill:
    runner:
      $type: acp
      agent: ../../agents/pi.yml
      config:
        model: opencode-go/deepseek-v4.1-flash
  claude-with-skill:
    runner:
      $type: acp
      agent: ../../agents/claude.yml
      config:
        model: haiku
    files:
      .claude/skills/deploy-runbook: skill
  claude-without-skill:
    runner:
      $type: acp
      agent: ../../agents/claude.yml
      config:
        model: haiku
