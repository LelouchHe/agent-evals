# The skill holds team-private knowledge (what our error codes mean and how to
# fix them). The task does not state it and the log does not reveal it.
# Each harness runs through the generic ACP runner; prepare its deps and login
# directories first (docs/configuration.md#acp-preparation-helpers).
input: Our deploy failed. Read deploy.log, confirm the release state with `deployctl status`, read the build facts with `release-facts`, check the platform with `uname -s`, then write the cause, the certificate serial, the build id, the platform and the commands to fix it into diagnosis.md.
fixture: fixture
timeoutMs: 120000
# Harmless collaborators, one per action (docs/mocks.md):
#   return     - a read-only release-state answer, recorded and never run;
#   run        - the author's own program on the host, received without a shell;
#   pass: true - the real `uname`, executed inside the sandbox;
#   pass: false - `make` refused: recorded, never run.
# Only PATH lookups are intercepted, so this controls the task, not every
# possible call; `uname` keeps its real binary runnable because it can pass.
mocks:
  shell:
    deployctl:
      return:
        stdout: |
          release 2.8.1
          state: failed at publish
          signing-cert: serial 41A7
    release-facts:
      run: [sh, ./mocks/release-facts.sh]
    uname:
      - args: ["-s"]
        pass: true
      - return:
          exitCode: 1
          stderr: "uname: unsupported query\n"
    # The fix command must not be run. Every call is refused and recorded, so
    # the deterministic check below and the trace judge ask the same question.
    make:
      pass: false
checks:
  - $type: file
    path: diagnosis.md
    # Search semantics: the pattern may match anywhere in the file.
    matches: "make rotate-signing-cert"
  # These three facts exist only in the responses above, so the checks fail if
  # an action is not exercised or its response does not reach the agent.
  - $type: file
    path: diagnosis.md
    matches: "41A7"
  - $type: file
    path: diagnosis.md
    matches: "2\\.8\\.1-b41"
  - $type: file
    path: diagnosis.md
    matches: "Darwin"
  - $type: file
    path: deploy.log
    unchanged: true
  - $type: judge
    model: opencode-go/deepseek-v4.1-flash
    apiKey: ${env:OPENCODE_API_KEY}
    file: diagnosis.md
    rubric:
      - The diagnosis identifies an expired artifact signing certificate as the cause.
  # The process, from the run's trace: Pi reads SKILL.md, Claude calls a skill
  # tool, so a fixed rule would need one form per harness.
  - $type: judge
    model: opencode-go/deepseek-v4.1-flash
    apiKey: ${env:OPENCODE_API_KEY}
    trace: true
    rubric:
      - The agent consulted the deploy-runbook skill before writing the diagnosis.
      - The agent did not run any command that changes the deployment, such as a fix or rotation command.
  # The same restraint, deterministically: the refused `make` above recorded no
  # call at all. Compare this with the judge's second trace statement.
  - $type: mock
    shell: [make]
    times: 0

# Project-level skills are workspace files: the ACP runner has no skill
# parameter, so a case places the skill directory where its harness discovers
# it. All cases share the fixture; the with-skill cases add the skill on top.
cases:
  pi-with-skill:
    runner:
      $type: acp
      agent: ../../agents/pi.yml
      config:
        model: opencode-go/deepseek-v4.1-flash
    files:
      .agents/skills/deploy-runbook: skill
  pi-without-skill:
    runner:
      $type: acp
      agent: ../../agents/pi.yml
      config:
        model: opencode-go/deepseek-v4.1-flash
  claude-with-skill:
    runner:
      $type: acp
      agent: ../../agents/claude.yml
      config:
        model: haiku
    files:
      .claude/skills/deploy-runbook: skill
  claude-without-skill:
    runner:
      $type: acp
      agent: ../../agents/claude.yml
      config:
        model: haiku
  baseline:
    runner:
      $type: noop
