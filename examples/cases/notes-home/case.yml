# Demonstrates HOME (`~/`) placement, top-level defaults with case replacement
# (`runner`), additive collection unions (`files` and `checks`), directory-level
# `changed: false` restraints, and glob `path` checks.
#
# Run with `--jobs 3 --retain on-failure` to execute all arms concurrently and
# keep `workspace/` and `home/` (excluding login files) for any failed run.
input: Organize today's session-notes.md into my notes directory at $HOME/notes.
fixture: fixture
timeoutMs: 180000

# Default runner for every case; `baseline` replaces it with `$type: noop`.
runner:
  $type: acp
  agent: ../../agents/pi.yml
  config:
    model: opencode-go/deepseek-v4.1-flash

# Common `files` places user notes into the run's isolated HOME; the with-skill
# case adds its own disjoint `.agents/skills/...` entry without repeating this.
files:
  ~/notes: home-notes

checks:
  # Confirmed milestone must leave inbox and land in either decisions.md or changelog.md.
  - $type: file
    path: ~/notes/inbox.md
    notMatches: "TLS 1.3 cutover"
  - $type: file
    path: ~/notes/{decisions,changelog}.md
    matches: /(?i)tls 1\.3/
  # Unconfirmed idea must stay in inbox and never enter settled records.
  - $type: file
    path: ~/notes/inbox.md
    matches: /(?i)grpc/
  - $type: file
    path: ~/notes/{decisions,changelog}.md
    notMatches: /(?i)grpc/
  # Directory-level restraint: the archive tree must remain completely untouched.
  - $type: file
    path: ~/notes/archive
    changed: false

cases:
  pi-with-skill:
    files:
      .agents/skills/notes-policy: skill
    # Appended after the common checks (arm-integrity assertion).
    checks:
      - $type: trace
        event: skill
        name: notes-policy

  pi-without-skill: {}

  # Vacuity guard: replaces the default runner with `noop` and expects failure.
  baseline:
    runner:
      $type: noop
    expect: fail
