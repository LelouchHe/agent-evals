# Prepare deps with ./examples/agents/pi-setup.sh <dir> and run the login helper
# once (see docs/setup.md). deps holds software only; the settings file sits
# beside this file and is copied into the run HOME.
acpCommand: [pi-acp]
deps: ${env:PI_DEPS}
files:
  ~/.pi/agent/settings.json: pi-settings.json
login:
  command: [pi]
  dir: ${env:PI_LOGIN}
  files: [.pi/agent/auth.json]
