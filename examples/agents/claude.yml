# Prepare deps and login with ./examples/agents/claude-setup.sh <dir> (see docs/setup.md).
# Authentication uses a one-year `claude setup-token` token from .env rather than a login file;
# CLAUDE_CODE_TMPDIR redirects Claude Code away from the shared /tmp/claude-<uid> directory.
command: [claude]
acpCommand: [claude-agent-acp]
environment:
  CLAUDE_CODE_OAUTH_TOKEN: ${env:CLAUDE_OAUTH_TOKEN}
  CLAUDE_CODE_TMPDIR: ${TMPDIR}
home:
  deps: ${env:CLAUDE_DEPS}
  login: ${env:CLAUDE_LOGIN}
  path: [.local/bin]
login:
  - .claude.json
