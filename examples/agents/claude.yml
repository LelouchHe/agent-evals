# Prepare deps first; an isolated Claude installation and its temporary-directory
# requirements have not yet been verified end to end. See docs/m2-plan.md.
command: [claude]
acpCommand: [claude-agent-acp]
home:
  deps: $env:CLAUDE_DEPS
  login: $env:CLAUDE_LOGIN
  path: [.local/bin]
login:
  - .claude.json
  - .claude/.credentials.json
