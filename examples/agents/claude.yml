# deps holds Node, @agentclientprotocol/claude-agent-acp and a `claude` link to its
# bundled binary under .local/bin. Authentication is a `claude setup-token` token
# (subscription, valid one year, never refreshed), so no credential file is copied in.
# Steps: docs/configuration.md#claude-code-token.
# Claude Code ignores TMPDIR and otherwise writes to the shared /tmp/claude-<uid>,
# which the sandbox denies. See docs/m2-plan.md.
command: [claude]
acpCommand: [claude-agent-acp]
environment:
  CLAUDE_CODE_OAUTH_TOKEN: ${env:CLAUDE_OAUTH_TOKEN}
  CLAUDE_CODE_TMPDIR: ${TMPDIR}
home:
  deps: ${env:CLAUDE_DEPS}
  login: ${env:CLAUDE_LOGIN}
  path: [.local/bin]
login:
  - .claude.json
