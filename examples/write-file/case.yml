# The agent starts in an empty workspace and is asked to create one file.
input: Create hello.txt with exactly the content "Hello, world!".
timeoutMs: 120000
checks:
  - $type: file
    path: hello.txt
    exists: true
    # Search (not an implicit full-file match). One trailing newline is allowed.
    matches: '^Hello, world!\n?$'
  - $type: judge
    # Replace both placeholder models before a real run; the example does not
    # execute a model by default.
    model: select-provider/select-judge-model
    thinking: medium
    file: hello.txt
    rubric:
      - hello.txt exists and its content is "Hello, world!", allowing one final newline.
