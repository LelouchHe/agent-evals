# One source file. Common fields are invariants shared by every named case;
# each case supplies its complete runner record. A top-level field may not
# appear in both the common part and the selected case.
input: Create hello.txt with exactly the content "Hello, world!".
timeoutMs: 120000
checks:
  - $type: file
    path: hello.txt
    exists: true
    # Search (not an implicit full-file match). One trailing newline is allowed.
    matches: '^Hello, world!\n?$'
  - $type: judge
    # Independent Pi invocation; omitted thinking uses the checker default.
    model: opencode-go/deepseek-v4.1-flash
    envPassthrough:
      - OPENCODE_API_KEY
    file: hello.txt
    rubric:
      - hello.txt exists and its content is "Hello, world!", allowing one final newline.

cases:
  with-skill:
    runner:
      $type: pi
      model: opencode-go/deepseek-v4.1-flash
      # Omitted thinking uses the runner default (medium).
      envPassthrough:
        - OPENCODE_API_KEY
      # Resolved relative to this file and loaded explicitly. Discovered skills,
      # extensions, MCP servers, sessions, and global configuration stay disabled.
      skills:
        - skill

  # The empty skills list is meaningful: automatic skill discovery stays disabled.
  without-skill:
    runner:
      $type: pi
      model: opencode-go/deepseek-v4.1-flash
      envPassthrough:
        - OPENCODE_API_KEY
      skills: []
