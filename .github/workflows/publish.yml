name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-win-sandbox:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/win-sandbox

      - name: Build win-sandbox.exe
        working-directory: native/win-sandbox
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: win-sandbox-exe
          path: native/win-sandbox/target/release/win-sandbox.exe
          if-no-files-found: error

  publish:
    needs: [test, build-win-sandbox]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: win-sandbox-exe
          path: native/win-sandbox/target/release

      - name: Verify bundled win-sandbox.exe
        run: test -f native/win-sandbox/target/release/win-sandbox.exe

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      # A tag is the release; refuse one that names a different version than the package.
      - name: Check the tag matches the package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
