name: Windows Sandbox User PoC

on:
  workflow_dispatch:
  push:
    branches:
      - "poc/windows-sandbox-user"

jobs:
  windows-poc:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/win-sandbox

      - name: Build win-sandbox.exe (Rust)
        working-directory: native/win-sandbox
        run: cargo build --release

      - name: Provision agent-evals-online and agent-evals-offline sandbox users
        run: pwsh -File scripts/windows-sandbox-setup.ps1

      - name: Install Node dependencies
        run: npm ci --force

      - name: Typecheck
        run: npm run typecheck

      - name: Run Windows sandbox-user PoC tests (PowerShell, pipe, git, firewall, fake agent)
        run: node --test --test-timeout=60000 src/platform/windows/sandbox.test.ts

      - name: Teardown sandbox users
        if: always()
        run: pwsh -File scripts/windows-sandbox-setup.ps1 -Teardown
